name: Verify revenue trend V124 (finance untouched)

on:
  push:
    branches:
      - v124-dashboard-chart-repair
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-price-draft-chart-test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: darma
          POSTGRES_USER: darma
          POSTGRES_PASSWORD: darma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: darma
      DB_USER: darma
      DB_PASSWORD: darma
      DJANGO_SETTINGS_MODULE: config.settings
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Python, Django, migrations and template check
        run: |
          python -m compileall -q core/excel_dashboard_v89.py core/test_dashboard_chart_v124.py core/management/commands/check_dashboard_trend_v124.py
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python - <<'PY'
          import django
          django.setup()
          from django.template.loader import get_template
          get_template("core/dashboard_excel_v89.html")
          print("PASS: dashboard HTML template valid")
          PY
      - name: Disposable database: no-price phantom sales-day regressions
        run: |
          # Historical migration 0013 requires production-seeded Brand rows,
          # so build only the temporary test schema directly. Never touch ERP.
          python - <<'PY'
          import django
          django.setup()
          from django.test import override_settings
          from django.core.management import call_command
          with override_settings(MIGRATION_MODULES={"core": None}):
              call_command("test", "core.test_dashboard_chart_v124",
                           interactive=False, verbosity=2)
          PY
      - name: No finance, sale schema or material/warehouse scope changes
        run: |
          test -z "$(git diff --name-only origin/v123-material-color-apply-inventory-transfer..HEAD -- core/finance.py core/models.py core/migrations core/material_report_v92.py core/material_report_v23.py core/inventory_transfer_v123.py templates/base.html)" || exit 1
