name: Check Darma material payment colors V124

on:
  push:
    branches:
      - v124-dynamic-payment-fabric-colors
    paths:
      - "core/material_payment_colors_v124.py"
      - "core/business_tools_v91.py"
      - "core/material_purchase_v13.py"
      - "core/management/commands/check_payment_colors_v124.py"
      - ".github/workflows/check-payment-colors-v124.yml"
      - "server_payment_colors_v124.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-payment-colors:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax and framework check
        run: |
          python -m compileall -q core/business_tools_v91.py core/material_payment_colors_v124.py core/material_purchase_v13.py core/management/commands/check_payment_colors_v124.py
          python manage.py check
      - name: Validate guarded Docker Hub 403 recovery is non-mutating
        run: |
          sh -n server_payment_colors_v124.sh
          python - <<'PY'
          from pathlib import Path
          shell=Path("server_payment_colors_v124.sh").read_text("utf-8")
          for needle in (
              "docker compose build web",
              "production.cloudfront.docker.com",
              "public.ecr.aws/docker/library/python:3.12-slim",
              "mirror.gcr.io/library/python:3.12-slim",
              "docker buildx build --load",
              "docker compose config --format json",
              "--no-deps --no-build --force-recreate web",
              'test "$PRE" = "$PROJECTED"',
              'test "$PRE" = "$FINAL"',
              'test "$(sha256sum Caddyfile',
          ):
              if needle not in shell:
                  raise RuntimeError("V124 guarded deployment regression: "+needle)
          assert Path("Dockerfile").read_text().splitlines()[0] == "FROM python:3.12-slim"
          print("PASS: safe mirrored Python build with unchanged Dockerfile/Caddy and ERP snapshots")
          PY
      - name: Synthetic custom-color purchase and dropdown template
        run: |
          python - <<'PY'
          import django
          django.setup()
          from core.management.commands.check_payment_colors_v124 import synthetic_test
          from django.template.loader import get_template
          synthetic_test()
          get_template("core/payments_v91.html")
          get_template("core/_payment_edit_v22.html")
          print("PASS: custom Darma inventory color appears once in payment form")
          print("PASS: custom fabric purchase posts exact stable color ID and correct invoice value")
          print("PASS: legacy nine colors are preserved and unknown color is rejected")
          PY
