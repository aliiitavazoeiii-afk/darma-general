{% load static %}<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود | DARMA ERP</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.rtl.min.css"></head><body class="d-flex flex-column bg-body-tertiary"><div class="page page-center"><div class="container container-tight py-4"><div class="text-center mb-4"><div class="h1">DARMA ERP</div><div class="text-secondary">پنل مدیریت کسب‌وکار</div></div><form class="card card-md" method="post" autocomplete="off">{% csrf_token %}<div class="card-body"><h2 class="h2 text-center mb-4">ورود به پنل</h2>{% if form.errors %}<div class="alert alert-danger">نام کاربری یا رمز عبور درست نیست.</div>{% endif %}<div class="mb-3"><label class="form-label">نام کاربری</label><input name="username" class="form-control" required autofocus></div><div class="mb-2"><label class="form-label">رمز عبور</label><input type="password" name="password" class="form-control" required></div><div class="form-footer"><button type="submit" class="btn btn-primary w-100">ورود</button></div></div></form></div></div></body></html>
