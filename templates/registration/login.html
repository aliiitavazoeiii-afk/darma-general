<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود | Dia Gallery</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.rtl.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"><style>body{font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh;background:radial-gradient(circle at 20% 10%,#173a5d,#071426 45%,#06111f);color:#fff;display:grid;place-items:center}.login-card{width:min(92vw,420px);padding:28px;border:1px solid rgba(255,255,255,.15);border-radius:20px;background:rgba(8,27,48,.7);backdrop-filter:blur(20px);box-shadow:0 25px 70px rgba(0,0,0,.35)}.mark{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#fb6514,#f79009);display:grid;place-items:center;font-size:1.4rem;font-weight:900;margin-bottom:18px}.form-control{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff;min-height:46px}.form-control:focus{background:rgba(255,255,255,.12);color:#fff;border-color:#f79009}.btn-primary{background:#fb6514;border-color:#fb6514;min-height:46px}</style></head><body><div class="login-card"><div class="mark">D</div><h1 class="h2 mb-1">Dia Gallery</h1><div class="text-secondary mb-4">ورود به پنل مدیریت</div>{% if form.errors %}<div class="alert alert-danger">نام کاربری یا رمز عبور درست نیست.</div>{% endif %}<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">نام کاربری</label><input class="form-control" name="username" autofocus required></div><div class="mb-4"><label class="form-label">رمز عبور</label><input class="form-control" type="password" name="password" required></div><button class="btn btn-primary w-100">ورود</button></form></div></body></html>
