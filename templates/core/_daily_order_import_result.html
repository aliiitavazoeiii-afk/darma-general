{% if import_result %}
<div class="card mb-4">
  <div class="card-header"><h3 class="card-title">نتیجه آخرین ورود فایل</h3></div>
  <div class="card-body">
    <div class="row g-2">
      <div class="col-6 col-md-3"><div class="subheader">فایل</div><strong>{{ import_result.filename }}</strong></div>
      <div class="col-6 col-md-3"><div class="subheader">ردیف تجمیعی</div><strong class="num">{{ import_result.grouped_lines }}</strong></div>
      <div class="col-6 col-md-3"><div class="subheader">تعداد کالا</div><strong class="num">{{ import_result.total_quantity }}</strong></div>
      <div class="col-6 col-md-3"><div class="subheader">کمبود موجودی</div><strong class="num">{{ import_result.shortage_count }}</strong></div>
    </div>
  </div>
</div>
{% endif %}
