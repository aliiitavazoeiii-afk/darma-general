{% extends 'base.html' %}{% load jalali %}{% block content %}<div class="page-header mb-4"><h2 class="page-title">فروش {{ day.date|jalali }}</h2><div class="text-secondary">برند را انتخاب کن</div></div><div class="row row-cards">{% for b,ps in cards %}<div class="col-md-6"><div class="card"><div class="card-body"><h2>{{ b.name }}</h2><p class="text-secondary">ورود مرحله‌ای سایزها و کدها</p>{% if ps %}<a class="btn btn-primary" href="{% url 'sale_size' day.id b.id ps.size.id %}">شروع {{ b.name }}</a>{% else %}<span class="text-secondary">هنوز محصولی تعریف نشده.</span>{% endif %}</div></div></div>{% endfor %}</div>{% endblock %}
