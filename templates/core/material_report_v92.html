{% extends 'core/material_report_v36.html' %}{% load jalali static %}

{% block scripts %}
{{ block.super }}
<style>
.material-month-kpis{display:grid;grid-template-columns:repeat(5,minmax(135px,1fr));gap:8px;flex:1 1 780px}.material-month-kpi{border:1px solid rgba(255,255,255,.11);border-radius:13px;background:rgba(255,255,255,.035);padding:10px 12px;min-height:72px}.material-month-kpi span{display:block;color:#9fb0c4;font-size:.71rem;line-height:1.45}.material-month-kpi strong{display:block;color:#fff;font-size:1.13rem;font-weight:850;margin-top:5px;direction:rtl}.material-month-kpi .num{display:inline-block;direction:ltr!important;text-align:right!important}.material-month-archive{border:1px solid rgba(255,255,255,.12);border-radius:15px;background:linear-gradient(135deg,rgba(15,39,65,.34),rgba(6,22,39,.24));overflow:hidden}.material-month-archive>summary{cursor:pointer;list-style:none;padding:15px 17px;display:flex;justify-content:space-between;align-items:center;gap:12px}.material-month-archive>summary::-webkit-details-marker{display:none}.material-month-archive>summary:hover{background:rgba(255,255,255,.035)}.material-month-archive-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.material-month-archive-title strong{font-size:1rem}.material-month-count{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:.72rem;color:#b9cbe0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10)}.material-month-archive-toggle{font-size:.75rem;color:#95a7ba;white-space:nowrap}.material-month-archive-body{padding:0 12px 1px;border-top:1px solid rgba(255,255,255,.08)}.material-month-archive-body>.material-block{margin-top:12px!important}.material-color-progress-wrap{margin:-2px 0 16px}.material-color-progress-title{font-size:.8rem;color:#aebdcd;margin:0 0 8px 2px}.material-color-progress-grid{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:8px}.material-color-progress-card{border:1px solid rgba(255,255,255,.11);border-radius:13px;background:rgba(255,255,255,.035);padding:11px 12px;min-height:102px}.material-color-progress-card h4{margin:0 0 8px;font-size:.9rem;color:#fff}.material-color-progress-metrics{display:grid;grid-template-columns:1fr;gap:4px}.material-color-progress-metrics div{display:flex;justify-content:space-between;gap:8px;font-size:.73rem;color:#9fb0c4}.material-color-progress-metrics b{color:#f6f9fc;font-size:.8rem}.material-color-progress-metrics .pending b{color:#ffd08a}.material-color-progress-empty{opacity:.62}
@media(max-width:1200px){.material-month-kpis{grid-template-columns:repeat(3,minmax(135px,1fr));flex-basis:100%}.material-color-progress-grid{grid-template-columns:repeat(3,minmax(150px,1fr))}}@media(max-width:767.98px){.material-month-kpis{grid-template-columns:1fr 1fr}.material-page-tools{align-items:stretch}.material-search{width:100%;min-width:0!important;max-width:none!important}.material-color-progress-grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.material-month-kpis{grid-template-columns:1fr}.material-color-progress-grid{grid-template-columns:1fr}}
</style>

<template id="materialV92Kpis" data-current-month="{{ material_current_month_key }}">
  <div class="material-month-kpis" aria-label="خلاصه ماه جاری">
    <div class="material-month-kpi"><span>پارچه تحویلی این ماه</span><strong><span class="num">{{ material_month_summary.roll_count|groupnum }}</span> طاقه</strong></div>
    <div class="material-month-kpi"><span>وزن تحویلی این ماه</span><strong><span class="num">{{ material_month_summary.weight_display }}</span> کیلو</strong></div>
    <div class="material-month-kpi"><span>حداقل تعداد تحویلی</span><strong><span class="num">{{ material_month_summary.minimum_delivery|groupnum }}</span> عدد</strong></div>
    <div class="material-month-kpi"><span>تعداد تحویل‌شده</span><strong><span class="num">{{ material_month_summary.delivered|groupnum }}</span> عدد</strong></div>
    <div class="material-month-kpi"><span>مانده تحویل</span><strong><span class="num">{{ material_month_summary.pending|groupnum }}</span> عدد</strong></div>
  </div>
</template>

<template id="materialV102ColorProgress">
  <section class="material-color-progress-wrap" aria-label="وضعیت پنج رنگ اصلی">
    <div class="material-color-progress-title">کارهای باز پنج رنگ اصلی — فقط صورت‌هایی که هنوز تحویلشان کامل نشده</div>
    <div class="material-color-progress-grid">
      {% for item in material_base_color_progress %}
      <div class="material-color-progress-card {% if not item.pending %}material-color-progress-empty{% endif %}" data-base-color="{{ item.key }}">
        <h4>{{ item.label }}</h4>
        <div class="material-color-progress-metrics">
          <div><span>طبق برش باید تحویل شود</span><b class="num">{{ item.expected|groupnum }}</b></div>
          <div><span>تا الان تحویل شده</span><b class="num">{{ item.delivered|groupnum }}</b></div>
          <div class="pending"><span>مانده تحویل</span><b class="num">{{ item.pending|groupnum }}</b></div>
        </div>
      </div>
      {% endfor %}
    </div>
  </section>
</template>

<script>
(() => {
  const monthNames = {
    1:'فروردین',2:'اردیبهشت',3:'خرداد',4:'تیر',5:'مرداد',6:'شهریور',
    7:'مهر',8:'آبان',9:'آذر',10:'دی',11:'بهمن',12:'اسفند'
  };
  const tpl = document.getElementById('materialV92Kpis');
  const currentMonth = String(tpl?.dataset.currentMonth || '');

  // V92 header is intentionally compact: keep title/create form, remove explanatory prose.
  document.querySelector('.mobile-page-head .page-muted')?.remove();
  document.querySelector('.material-stock-note')?.remove();

  const tools = document.querySelector('.material-page-tools');
  if (tools && tpl) tools.appendChild(tpl.content.cloneNode(true));

  const colorTpl = document.getElementById('materialV102ColorProgress');
  if (tools && colorTpl && tools.parentNode) {
    tools.parentNode.insertBefore(colorTpl.content.cloneNode(true), tools.nextSibling);
  }

  const blocks = Array.from(document.querySelectorAll('.material-block'));
  const archives = new Map();
  const keyToNumber = (key) => {
    const parts = String(key || '').split('/');
    return (Number(parts[0]) * 100) + Number(parts[1]);
  };
  const currentNumber = keyToNumber(currentMonth);

  blocks.forEach((block) => {
    const rawDate = String(block.querySelector('.material-date')?.textContent || '').trim();
    const parts = rawDate.split('/');
    if (parts.length < 2) return;
    const year = Number(parts[0]);
    const month = Number(parts[1]);
    if (!year || !month) return;
    const key = `${String(year).padStart(4,'0')}/${String(month).padStart(2,'0')}`;

    // Only completed/past Jalali months collapse. Current/future sheets remain normal rows.
    if (keyToNumber(key) >= currentNumber) return;

    let entry = archives.get(key);
    if (!entry) {
      const archive = document.createElement('details');
      archive.className = 'material-month-archive mb-3';
      archive.dataset.monthKey = key;
      const label = `${monthNames[month] || month} ${year}`;
      archive.dataset.search = `صورت ${label}`.toLowerCase();

      const summary = document.createElement('summary');
      const titleWrap = document.createElement('div');
      titleWrap.className = 'material-month-archive-title';
      const title = document.createElement('strong');
      title.textContent = `صورت ${label}`;
      const count = document.createElement('span');
      count.className = 'material-month-count';
      count.textContent = '0 صورت';
      titleWrap.append(title, count);
      const toggle = document.createElement('span');
      toggle.className = 'material-month-archive-toggle';
      toggle.textContent = 'باز / بسته';
      summary.append(titleWrap, toggle);

      const body = document.createElement('div');
      body.className = 'material-month-archive-body';
      archive.append(summary, body);
      block.parentNode.insertBefore(archive, block);
      entry = {archive, body, count, total:0};
      archives.set(key, entry);
    }

    entry.body.appendChild(block);
    entry.total += 1;
    entry.count.textContent = `${entry.total} صورت`;
  });

  const targetId = location.hash && location.hash.startsWith('#block-') ? location.hash : '';
  if (targetId) {
    const target = document.querySelector(targetId);
    if (target) {
      target.open = true;
      const archive = target.closest('.material-month-archive');
      if (archive) archive.open = true;
    }
  }

  const normalizeDigits = (value) => String(value || '')
    .replace(/[۰-۹]/g, (d) => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))
    .replace(/[٠-٩]/g, (d) => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));

  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('materialBlockSearch');
    if (!input) return;
    input.addEventListener('input', () => {
      const query = normalizeDigits(input.value).trim().toLowerCase();
      archives.forEach((entry) => {
        const monthMatch = Boolean(query) && normalizeDigits(entry.archive.dataset.search || '').includes(query);
        const children = Array.from(entry.body.querySelectorAll('.material-block'));
        if (monthMatch) children.forEach((child) => child.classList.remove('d-none'));
        const hasVisible = children.some((child) => !child.classList.contains('d-none'));
        entry.archive.classList.toggle('d-none', Boolean(query) && !hasVisible);
        if (query && hasVisible) entry.archive.open = true;
      });
    });
  });
})();
</script>
{% endblock %}
