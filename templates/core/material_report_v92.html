{% extends 'core/material_report_v36.html' %}{% load jalali static %}

{% block scripts %}
{{ block.super }}
<style>
.material-v105-kpi-wrap{width:100%}.material-month-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.material-month-kpi{min-width:0;border:1px solid rgba(255,255,255,.11);border-radius:14px;background:rgba(255,255,255,.035);padding:13px 14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}.material-month-kpi .kpi-label{display:block;color:#9fb0c4;font-size:.72rem;line-height:1.45;font-weight:700}.material-month-kpi .kpi-value{direction:ltr;unicode-bidi:isolate;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap;color:#fff;font-size:1.42rem;font-weight:950;line-height:1.15;margin-top:12px}.material-month-kpi .kpi-unit{display:block;color:#8fa2b7;font-size:.68rem;margin-top:5px;line-height:1.4}.material-month-kpi.highlight .kpi-value{color:#ffd08a}.material-month-archive{border:1px solid rgba(255,255,255,.12);border-radius:15px;background:linear-gradient(135deg,rgba(15,39,65,.34),rgba(6,22,39,.24));overflow:hidden}.material-month-archive>summary{cursor:pointer;list-style:none;padding:15px 17px;display:flex;justify-content:space-between;align-items:center;gap:12px}.material-month-archive>summary::-webkit-details-marker{display:none}.material-month-archive>summary:hover{background:rgba(255,255,255,.035)}.material-month-archive-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.material-month-archive-title strong{font-size:1rem}.material-month-count{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:.72rem;color:#b9cbe0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10)}.material-month-archive-toggle{font-size:.75rem;color:#95a7ba;white-space:nowrap}.material-month-archive-body{padding:0 12px 1px;border-top:1px solid rgba(255,255,255,.08)}.material-month-archive-body>.material-block{margin-top:12px!important}
@media(max-width:1200px){.material-month-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:767.98px){.material-month-kpis{grid-template-columns:1fr 1fr}.material-page-tools{align-items:stretch}.material-search{width:100%;min-width:0!important;max-width:none!important}}@media(max-width:430px){.material-month-kpis{grid-template-columns:1fr}.material-month-kpi{min-height:84px}.material-month-kpi .kpi-value{font-size:1.3rem}}
</style>

<template id="materialV92Kpis" data-current-month="{{ material_current_month_key }}">
  <div class="material-month-kpis" aria-label="خلاصه گزارش مواد اولیه" data-material-kpis="v105">
    <div class="material-month-kpi"><span class="kpi-label">پارچه تحویلی این ماه</span><div class="kpi-value">{{ material_month_summary.roll_count|groupnum }}</div><span class="kpi-unit">طاقه · {{ material_current_month_label }}</span></div>
    <div class="material-month-kpi"><span class="kpi-label">وزن تحویلی این ماه</span><div class="kpi-value">{{ material_month_summary.weight_display }}</div><span class="kpi-unit">کیلو · {{ material_current_month_label }}</span></div>
    <div class="material-month-kpi"><span class="kpi-label">حداقل تعداد تحویلی</span><div class="kpi-value">{{ material_month_summary.minimum_delivery|groupnum }}</div><span class="kpi-unit">عدد · مجموع برش ماه</span></div>
    <div class="material-month-kpi"><span class="kpi-label">تعداد تحویل‌شده</span><div class="kpi-value">{{ material_month_summary.delivered|groupnum }}</div><span class="kpi-unit">عدد · تحویل اعمال‌شده</span></div>
    <div class="material-month-kpi"><span class="kpi-label">مانده تحویل</span><div class="kpi-value">{{ material_month_summary.pending|groupnum }}</div><span class="kpi-unit">عدد · برش منهای تحویل</span></div>
    <div class="material-month-kpi highlight" data-material-kpi="average-cut"><span class="kpi-label">میانگین تعداد برش</span><div class="kpi-value">{{ material_cut_summary.average_cut|groupnum }}</div><span class="kpi-unit">عدد · {{ material_cut_summary.cut_entry_count|groupnum }} برش ثبت‌شده در ۵ رنگ پایه</span></div>
  </div>
</template>

<script>
(() => {
  const monthNames = {
    1:'فروردین',2:'اردیبهشت',3:'خرداد',4:'تیر',5:'مرداد',6:'شهریور',
    7:'مهر',8:'آبان',9:'آذر',10:'دی',11:'بهمن',12:'اسفند'
  };
  const tpl = document.getElementById('materialV92Kpis');
  const currentMonth = String(tpl?.dataset.currentMonth || '');

  // V92 header is intentionally compact: keep title/create form, remove explanatory prose.
  document.querySelector('.mobile-page-head .page-muted')?.remove();
  document.querySelector('.material-stock-note')?.remove();

  const header = document.querySelector('.mobile-page-head');
  if (header && tpl) {
    const mount = document.createElement('div');
    mount.className = 'material-v105-kpi-wrap mb-3';
    mount.appendChild(tpl.content.cloneNode(true));
    header.insertAdjacentElement('afterend', mount);
  }

  const blocks = Array.from(document.querySelectorAll('.material-block'));
  const archives = new Map();
  const keyToNumber = (key) => {
    const parts = String(key || '').split('/');
    return (Number(parts[0]) * 100) + Number(parts[1]);
  };
  const currentNumber = keyToNumber(currentMonth);

  blocks.forEach((block) => {
    const rawDate = String(block.querySelector('.material-date')?.textContent || '').trim();
    const parts = rawDate.split('/');
    if (parts.length < 2) return;
    const year = Number(parts[0]);
    const month = Number(parts[1]);
    if (!year || !month) return;
    const key = `${String(year).padStart(4,'0')}/${String(month).padStart(2,'0')}`;

    // Only completed/past Jalali months collapse. Current/future sheets remain normal rows.
    if (keyToNumber(key) >= currentNumber) return;

    let entry = archives.get(key);
    if (!entry) {
      const archive = document.createElement('details');
      archive.className = 'material-month-archive mb-3';
      archive.dataset.monthKey = key;
      const label = `${monthNames[month] || month} ${year}`;
      archive.dataset.search = `صورت ${label}`.toLowerCase();

      const summary = document.createElement('summary');
      const titleWrap = document.createElement('div');
      titleWrap.className = 'material-month-archive-title';
      const title = document.createElement('strong');
      title.textContent = `صورت ${label}`;
      const count = document.createElement('span');
      count.className = 'material-month-count';
      count.textContent = '0 صورت';
      titleWrap.append(title, count);
      const toggle = document.createElement('span');
      toggle.className = 'material-month-archive-toggle';
      toggle.textContent = 'باز / بسته';
      summary.append(titleWrap, toggle);

      const body = document.createElement('div');
      body.className = 'material-month-archive-body';
      archive.append(summary, body);
      block.parentNode.insertBefore(archive, block);
      entry = {archive, body, count, total:0};
      archives.set(key, entry);
    }

    entry.body.appendChild(block);
    entry.total += 1;
    entry.count.textContent = `${entry.total} صورت`;
  });

  const targetId = location.hash && location.hash.startsWith('#block-') ? location.hash : '';
  if (targetId) {
    const target = document.querySelector(targetId);
    if (target) {
      target.open = true;
      const archive = target.closest('.material-month-archive');
      if (archive) archive.open = true;
    }
  }

  const normalizeDigits = (value) => String(value || '')
    .replace(/[۰-۹]/g, (d) => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))
    .replace(/[٠-٩]/g, (d) => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));

  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('materialBlockSearch');
    if (!input) return;
    input.addEventListener('input', () => {
      const query = normalizeDigits(input.value).trim().toLowerCase();
      archives.forEach((entry) => {
        const monthMatch = Boolean(query) && normalizeDigits(entry.archive.dataset.search || '').includes(query);
        const children = Array.from(entry.body.querySelectorAll('.material-block'));
        if (monthMatch) children.forEach((child) => child.classList.remove('d-none'));
        const hasVisible = children.some((child) => !child.classList.contains('d-none'));
        entry.archive.classList.toggle('d-none', Boolean(query) && !hasVisible);
        if (query && hasVisible) entry.archive.open = true;
      });
    });
  });
})();
</script>
{% endblock %}
